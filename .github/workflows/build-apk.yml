name: Capacitor APK for NuvoraCraft Studio Builder
on:
  push:
    branches: [feat/auto-standardization]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    if: vars.APK_WEB_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CAPACITOR_APP_URL: ${{ vars.APK_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor Android and configure remote website
        working-directory: capacitor-wrapper
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: capacitor-wrapper/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify and upload APK
        run: test -s capacitor-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: studiobuilder-capacitor-apk
          path: capacitor-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
